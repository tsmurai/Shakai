<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="社会暗記">
<title>中学受験 社会暗記アプリ（地理・公民）</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#f4f6f5; --card:#ffffff; --ink:#1c2b27; --sub:#5b6b66; --line:#e2e8e5;
  --accent:#2f6f5e; --accent2:#e07a3f; --good:#2f8f5b; --bad:#d1495b;
  --chip:#eef3f1;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121816; --card:#1b2422; --ink:#eef3f1; --sub:#9db0aa; --line:#2b3634;
    --accent:#5fb59b; --accent2:#f0975a; --good:#4fbf82; --bad:#f07082; --chip:#22302c;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
  overscroll-behavior:none;
}
#app{max-width:720px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}
header.top{
  position:sticky; top:0; z-index:10; background:var(--bg);
  padding:14px 16px 10px; display:flex; align-items:center; gap:10px;
  border-bottom:1px solid var(--line);
}
header.top h1{font-size:15px; margin:0; flex:1; min-width:0; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
header.top{flex-wrap:nowrap;}
header.top .btn-icon{flex:none; white-space:nowrap;}
.btn-icon{
  background:var(--chip); border:none; color:var(--ink); border-radius:12px;
  padding:8px 12px; font-size:14px; font-weight:600; cursor:pointer;
}
main{flex:1; padding:14px 16px 90px;}
.hero{
  background:linear-gradient(135deg,var(--accent),#1f4f42); color:#fff; border-radius:20px;
  padding:22px 20px; margin-bottom:18px;
}
.hero h2{margin:0 0 6px; font-size:20px;}
.hero p{margin:0; opacity:.9; font-size:13.5px; line-height:1.6;}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:20px;}
.stat{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 8px; text-align:center; min-width:0;}
.stat b{display:block; font-size:20px; color:var(--accent);}
.stat span{font-size:11px; color:var(--sub);}
.menu-card{
  display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--line);
  border-radius:18px; padding:16px; margin-bottom:12px; cursor:pointer; transition:transform .1s;
}
.menu-card:active{transform:scale(.98);}
.menu-card .emoji{font-size:30px; width:46px; text-align:center;}
.menu-card .txt b{display:block; font-size:16px; margin-bottom:2px;}
.menu-card .txt span{font-size:12.5px; color:var(--sub);}
.section-title{font-size:14px; font-weight:700; color:var(--sub); margin:22px 0 10px; letter-spacing:.02em;}
.chipbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
.chip{
  background:var(--chip); border:1px solid var(--line); color:var(--ink); border-radius:999px;
  padding:7px 14px; font-size:13px; cursor:pointer; font-weight:600;
}
.chip.active{background:var(--accent); color:#fff; border-color:var(--accent);}
.userpicker{display:flex; gap:8px; margin-bottom:20px;}
.userchip{flex:1; background:var(--card); border:2px solid var(--line); color:var(--ink); border-radius:14px; padding:12px 8px; font-size:14px; font-weight:700; cursor:pointer;}
.userchip.active{background:var(--accent); color:#fff; border-color:var(--accent);}
input.search{
  width:100%; padding:12px 14px; border-radius:14px; border:1px solid var(--line);
  background:var(--card); color:var(--ink); font-size:15px; margin-bottom:14px;
}
details.tbl{
  background:var(--card); border:1px solid var(--line); border-radius:16px; margin-bottom:12px; overflow:hidden;
}
details.tbl summary{
  list-style:none; padding:14px 16px; cursor:pointer; display:flex; justify-content:space-between; align-items:center;
  font-weight:700; font-size:15px; gap:8px;
}
details.tbl summary .stitle{flex:1;}
details.tbl summary::-webkit-details-marker{display:none;}
details.tbl summary .arrow{color:var(--sub); transition:transform .15s; font-size:13px;}
details.tbl[open] summary .arrow{transform:rotate(90deg);}
.tag-ref{display:inline-block; font-size:10px; background:var(--chip); color:var(--sub); padding:2px 7px; border-radius:6px; font-weight:700; flex:none;}
.qbadge .tag-ref{margin-left:8px;}
.tbl-headline{font-size:12px; color:var(--accent); font-weight:600; padding:0 16px 10px; margin-top:-6px;}
.tbl-body{padding:0 16px 16px;}
table{width:100%; border-collapse:collapse; font-size:13.5px;}
table th{text-align:left; color:var(--sub); font-weight:600; padding:6px 4px; border-bottom:1px solid var(--line); font-size:11.5px;}
table td{padding:7px 4px; border-bottom:1px solid var(--line);}
table tr:last-child td{border-bottom:none;}
.rank{color:var(--accent); font-weight:700; width:34px;}
.note{font-size:12px; color:var(--sub); margin-top:10px; line-height:1.6; background:var(--chip); padding:8px 10px; border-radius:10px;}
dl.facts{margin:0; padding:0 16px 16px;}
.ansdetail{font-size:12.5px; font-weight:600; opacity:.85; margin-left:2px;}
.listranks{display:flex; flex-direction:column; gap:2px; margin-top:4px; font-size:12px; color:var(--sub);}
/* 小テストで間違えた問題 */
.btn-test{background:var(--accent2); color:#fff; border:none; border-radius:14px; font-size:15px; font-weight:700; cursor:pointer;}
.btn-test[disabled]{background:var(--chip); color:var(--sub); cursor:default;}
.btn-appwrong{background:var(--bad); color:#fff; border:none; border-radius:14px; font-size:15px; font-weight:700; cursor:pointer;}
.btn-appwrong[disabled]{background:var(--chip); color:var(--sub); cursor:default;}
.btn-ghost[disabled]{border-color:var(--line); color:var(--sub); cursor:default;}
.tag-wrong{display:inline-block; font-size:10px; background:var(--bad); color:#fff; padding:2px 7px; border-radius:6px; font-weight:700; margin-left:6px;}
.tag-test{display:inline-block; font-size:10px; background:var(--accent2); color:#fff; padding:2px 7px; border-radius:6px; font-weight:700; margin-left:6px;}
.btn-testmark{width:100%; margin-top:12px; padding:12px; border-radius:14px; cursor:pointer; font-size:13.5px; font-weight:700;
  background:var(--chip); color:var(--sub); border:2px dashed var(--line);}
.btn-testmark.on{background:var(--accent2); color:#fff; border-style:solid; border-color:var(--accent2);}
.tm-ok{color:var(--good); font-weight:700;}
.tm-ng{color:var(--bad); font-weight:700;}
.tm-yet{color:var(--sub); font-weight:700;}
dl.facts .fitem{padding:9px 0; border-bottom:1px solid var(--line);}
dl.facts .fitem:last-child{border-bottom:none;}
dl.facts dt{font-size:13.5px; color:var(--sub); margin-bottom:3px;}
dl.facts dd{margin:0; font-size:15px; font-weight:700;}

/* ---- charts ---- */
.chart-wrap{margin:2px 16px 14px; padding:14px 14px 12px; background:var(--chip); border-radius:14px;}
.chart-title{font-size:12px; font-weight:700; color:var(--accent); margin-bottom:8px;}
.chart-hidden{text-align:center; color:var(--sub); font-size:13px; padding:22px 10px;}
.masked{display:inline-block; min-width:2.4em; padding:0 6px; border:1.5px dashed var(--accent); border-radius:6px; color:var(--accent); font-weight:800; text-align:center;}
.face.back .masked{border-color:#fff; color:#fff;}
.rankctx table{font-size:13px;}
.rankctx td{padding:6px 4px;}
.rankctx tr.rankhit td{color:var(--accent); font-weight:800; background:color-mix(in srgb, var(--accent) 12%, transparent); border-radius:6px;}
.face.back .rankctx{background:rgba(255,255,255,.14);}
.face.back .chart-title{color:#fff;}
.face.back .rankctx tr.rankhit td{color:#fff; background:rgba(255,255,255,.22);}
.bar100{width:100%; height:28px; display:block; border-radius:4px; overflow:hidden;}
.legend{display:flex; flex-wrap:wrap; gap:7px 14px; margin-top:10px; font-size:11.5px; color:var(--sub);}
.legend .lg-item{display:flex; align-items:center; gap:5px;}
.legend .lg-item i{width:10px; height:10px; border-radius:3px; display:inline-block; flex:none;}
.gsb{display:flex; gap:22px; justify-content:center; align-items:flex-end; height:170px; margin-bottom:4px;}
.gsb-col{display:flex; flex-direction:column; align-items:center; height:100%; justify-content:flex-end;}
.gsb-bar{width:48px; height:150px; display:flex; flex-direction:column; border-radius:6px; overflow:hidden; border:1px solid var(--line);}
.gsb-seg{width:100%;}
.gsb-label{margin-top:7px; font-size:12px; font-weight:700; color:var(--ink);}
.gsb-values{width:100%; margin-top:12px; border-collapse:collapse; font-size:12px; font-variant-numeric:tabular-nums;}
.gsb-values th, .gsb-values td{padding:5px 4px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap;}
.gsb-values thead th{font-size:11.5px; color:var(--sub); font-weight:700;}
.gsb-values tbody td{font-weight:700; color:var(--ink);}
.gsb-values tr:last-child th, .gsb-values tr:last-child td{border-bottom:none;}
.gsb-vlabel{text-align:left !important; font-weight:600; color:var(--sub); display:flex; align-items:center; gap:5px;}
.gsb-vlabel i{width:9px; height:9px; border-radius:2px; display:inline-block; flex:none;}
.bubble-row{display:flex; justify-content:space-around; align-items:flex-end; gap:8px; flex-wrap:wrap; padding-top:6px;}
.bubble-col{display:flex; flex-direction:column; align-items:center;}
.bubble-label{margin-top:6px; font-size:12px; text-align:center; color:var(--ink); line-height:1.45;}
.barlist{display:flex; flex-direction:column; gap:9px; max-height:340px; overflow-y:auto; padding-right:2px;}
.barlist-row{display:grid; grid-template-columns:78px 1fr 70px; align-items:center; gap:8px; font-size:12px;}
.bl-label{color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.bl-track{background:var(--line); border-radius:99px; height:12px; overflow:hidden;}
.bl-fill{display:block; height:100%; border-radius:99px;}
.bl-value{text-align:right; font-weight:700; white-space:nowrap;}
.pyramid-wrap{display:flex; flex-direction:column; align-items:center;}
.pyramid-label{margin-top:8px; font-size:13px; font-weight:700;}
.compass{display:flex; flex-direction:column; align-items:center; gap:10px;}
.compass-row{display:flex; align-items:center; gap:14px;}
.compass-pt{text-align:center; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 10px; min-width:92px;}
.compass-pt b{display:block; font-size:11px; color:var(--accent);}
.compass-pt span{display:block; font-size:13px; font-weight:700; margin-top:2px;}
.compass-pt small{display:block; font-size:10px; color:var(--sub); margin-top:2px;}
.compass-center{width:52px; height:52px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12.5px; flex:none;}
.qchart{margin:0 0 16px;}
.qchart .chart-wrap{margin:0;}
.fc-chart{margin-bottom:12px; width:100%; max-width:480px;}
.fc-chart .chart-wrap{margin:0;}

/* quiz & flashcard shared */
.progressbar{height:6px; background:var(--chip); border-radius:99px; overflow:hidden; margin-bottom:16px;}
.progressbar i{display:block; height:100%; background:var(--accent);}
.qbadge{font-size:12px; color:var(--accent); font-weight:700; margin-bottom:8px;}
.qtext{font-size:20px; font-weight:700; line-height:1.5; margin-bottom:18px; min-height:70px;}
.choices{display:flex; flex-direction:column; gap:10px;}
.choice{
  background:var(--card); border:2px solid var(--line); border-radius:14px; padding:14px 16px;
  font-size:15.5px; text-align:left; cursor:pointer; font-weight:600; color:var(--ink);
}
.choice.correct{border-color:var(--good); background:color-mix(in srgb, var(--good) 14%, var(--card));}
.choice.wrong{border-color:var(--bad); background:color-mix(in srgb, var(--bad) 14%, var(--card));}
.choice[disabled]{opacity:.55;}
.choice.correct,.choice.wrong{opacity:1;}
.nextbar{margin-top:20px; display:flex; justify-content:flex-end;}
.btn-primary{
  background:var(--accent); color:#fff; border:none; border-radius:14px; padding:13px 22px;
  font-size:15px; font-weight:700; cursor:pointer;
}
.btn-ghost{
  background:transparent; color:var(--accent); border:2px solid var(--accent); border-radius:14px; padding:11px 20px;
  font-size:15px; font-weight:700; cursor:pointer;
}
.score-row{display:flex; gap:10px; margin:18px 0;}
.score-box{flex:1; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; text-align:center;}
.score-box b{font-size:26px; display:block;}
.wronglist{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:8px;}
.wronglist .q{font-size:12.5px; color:var(--sub); margin-bottom:4px;}
.wronglist .a{font-size:15px; font-weight:700;}

/* flashcard */
.fc-wrap{display:flex; flex-direction:column; align-items:center;}
.fc-count{font-size:13px; color:var(--sub); margin-bottom:10px;}
.card3d{width:100%; max-width:480px; height:62vh; min-height:320px; max-height:560px; perspective:1400px; margin-bottom:18px;}
.card-inner{position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d; cursor:pointer;}
.card-inner.flip{transform:rotateY(180deg);}
.face{
  position:absolute; inset:0; backface-visibility:hidden; border-radius:22px;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start; text-align:center; padding:24px 22px;
  border:1px solid var(--line); overflow-y:auto;
}
.face .spacer{flex:1 0 12px;}
.face.front{background:var(--card);}
.face.back{background:var(--accent); color:#fff; transform:rotateY(180deg);}
.face.back .chart-wrap{background:rgba(255,255,255,.14);}
.face.back .lg-item, .face.back .bl-label, .face.back .bl-value, .face.back .compass-pt, .face.back .gsb-label{color:#fff;}
.face.back .gsb-values thead th, .face.back .gsb-vlabel{color:rgba(255,255,255,.8);}
.face.back .gsb-values tbody td{color:#fff;}
.face.back .gsb-values th, .face.back .gsb-values td{border-bottom-color:rgba(255,255,255,.25);}
.face.back .compass-pt{background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.25);}
.face .tag{font-size:11.5px; opacity:.75; margin-bottom:8px; font-weight:700;}
.face .main{font-size:18px; font-weight:700; line-height:1.5;}
.face.back .main{font-size:16px;}
.face .hint{
  margin-top:14px; font-size:13.5px; font-weight:700; color:var(--accent);
  background:var(--chip); border:1.5px solid var(--accent); border-radius:999px;
  padding:9px 18px; display:inline-block;
}
.face.back .hint{color:#fff; background:rgba(255,255,255,.18); border-color:rgba(255,255,255,.6);}
.fc-btns{display:flex; gap:10px; width:100%; max-width:480px;}
.fc-btns button{flex:1; min-width:0; padding:14px 6px; border-radius:14px; border:none; font-size:13.5px; font-weight:700; cursor:pointer; white-space:nowrap;}
.fc-again{background:var(--good); color:#fff;}
.fc-good{background:var(--chip); color:var(--ink);}
.fc-wrong{background:var(--bad); color:#fff;}
.fc-good.confirming{background:var(--accent2); animation:pulse 1s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.6;}}
.fc-nav{display:flex; gap:14px; margin-top:14px; font-size:13px; color:var(--sub);}
.fc-nav span{cursor:pointer; text-decoration:underline;}

.bottomnav{
  position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--line);
  padding:8px 6px calc(8px + env(safe-area-inset-bottom)); display:flex; justify-content:center; z-index:20;
}
.bottomnav-inner{display:flex; max-width:720px; width:100%; gap:4px;}
.navbtn{flex:1; min-width:0; background:none; border:none; color:var(--sub); font-size:10.5px; padding:6px 2px; border-radius:12px; cursor:pointer; font-weight:600;}
.navbtn .ic{display:block; font-size:18px; margin-bottom:2px;}
.navbtn.active{color:var(--accent); background:var(--chip);}
.empty{text-align:center; color:var(--sub); padding:40px 10px; font-size:14px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ========================= チャート部品（SVG/HTML） ========================= */
const MASK = '<span class="masked">？</span>';
const MASK_FILL = 'var(--line)';
function stackedBar(segments, maskLabel){
  const hasMask = segments.some(s=>s.label===maskLabel);
  const RESERVED = 22;
  const othersTotal = segments.filter(s=>s.label!==maskLabel).reduce((s,x)=>s+x.value,0);
  const avail = hasMask ? (100-RESERVED) : 100;
  let x = 0;
  const rects = segments.map((seg,i)=>{
    const isMasked = seg.label===maskLabel;
    const width = isMasked ? RESERVED : (othersTotal>0 ? seg.value/othersTotal*avail : 0);
    const w = Math.max(width - (width>1?0.6:0), 0.2);
    const fill = isMasked ? MASK_FILL : `var(--s${(seg.c!=null?seg.c:i%8)+1})`;
    const r = `<rect x="${x}%" y="0" width="${w}%" height="100%" fill="${fill}" rx="3"></rect>`;
    x += width;
    return r;
  }).join('');
  const legend = segments.map((seg,i)=>{
    const isMasked = seg.label===maskLabel;
    const swatch = isMasked ? MASK_FILL : `var(--s${(seg.c!=null?seg.c:i%8)+1})`;
    return `<span class="lg-item"><i style="background:${swatch}"></i>${seg.label} ${isMasked?MASK:seg.value+'%'}</span>`;
  }).join('');
  return `<div class="chart-wrap"><svg viewBox="0 0 100 28" preserveAspectRatio="none" class="bar100">${rects}</svg><div class="legend">${legend}</div></div>`;
}
function groupedStackedBars(groups, maskGroup, maskSeg){
  const RESERVED = 28;
  const cols = groups.map(g=>{
    const maskedHere = g.label===maskGroup;
    const othersTotal = g.segments.filter(s=>s.label!==maskSeg).reduce((s,x)=>s+x.value,0);
    const avail = maskedHere ? (100-RESERVED) : 100;
    const segs = g.segments.map((s,i)=>{
      const isMasked = maskedHere && s.label===maskSeg;
      const h = isMasked ? RESERVED : (maskedHere ? (othersTotal>0? s.value/othersTotal*avail : 0) : s.value);
      const fill = isMasked ? MASK_FILL : `var(--s${(s.c!=null?s.c:i%8)+1})`;
      return `<div class="gsb-seg" style="height:${h}%; background:${fill}"></div>`;
    }).join('');
    return `<div class="gsb-col"><div class="gsb-bar">${segs}</div><div class="gsb-label">${g.label}${maskedHere?' '+MASK:''}</div></div>`;
  }).join('');
  // 数値表。区分が小さい（4.7%など）と棒の中に文字が入らないので、下に一覧で出す。
  // 出題中（maskGroup指定あり）は答えが漏れるので表示しない。
  let valueTable = '';
  if(!maskGroup){
    const head = groups.map(g=>`<th>${g.label}</th>`).join('');
    const rows = groups[0].segments.map((s,i)=>{
      const cells = groups.map(g=>{
        const hit = g.segments.find(x=>x.label===s.label);
        return `<td>${hit ? hit.value+'%' : '—'}</td>`;
      }).join('');
      return `<tr><th class="gsb-vlabel"><i style="background:var(--s${(s.c!=null?s.c:i%8)+1})"></i>${s.label}</th>${cells}</tr>`;
    }).join('');
    valueTable = `<table class="gsb-values"><thead><tr><th></th>${head}</tr></thead><tbody>${rows}</tbody></table>`;
  }
  const legend = groups[0].segments.map((s,i)=>`<span class="lg-item"><i style="background:var(--s${(s.c!=null?s.c:i%8)+1})"></i>${s.label}</span>`).join('');
  return `<div class="chart-wrap"><div class="gsb">${cols}</div>${valueTable || `<div class="legend">${legend}</div>`}</div>`;
}
function bubbleChart(items, unit, maskLabel){
  const maxR = 42;
  const NEUTRAL_R = 24;
  const refItems = items.filter(i=>i.label!==maskLabel);
  const max = Math.max(...(refItems.length?refItems:items).map(i=>i.value));
  const cols = items.map((it,i)=>{
    const isMasked = it.label===maskLabel;
    const r = isMasked ? NEUTRAL_R : Math.sqrt(it.value/max)*maxR;
    const size = maxR*2+10;
    const valText = isMasked ? MASK : `${it.value}${unit}`;
    const fill = isMasked ? MASK_FILL : `var(--s${(i%8)+1})`;
    return `<div class="bubble-col"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="${fill}" fill-opacity="0.9"></circle></svg><div class="bubble-label">${it.label}<br><b>${valText}</b></div></div>`;
  }).join('');
  return `<div class="chart-wrap"><div class="bubble-row">${cols}</div></div>`;
}
function barListChart(items, unit, colorIdx, maskLabel){
  const NEUTRAL_W = 38;
  const refItems = items.filter(i=>i.label!==maskLabel);
  const max = Math.max(...(refItems.length?refItems:items).map(i=>i.value));
  const c = colorIdx==null?0:colorIdx;
  const rows = items.map(it=>{
    const isMasked = it.label===maskLabel;
    const w = isMasked ? NEUTRAL_W : (it.value/max*100).toFixed(1);
    const fill = isMasked ? MASK_FILL : `var(--s${c+1})`;
    const valText = isMasked ? MASK : `${it.value}${unit}`;
    return `<div class="barlist-row"><span class="bl-label">${it.label}</span><span class="bl-track"><span class="bl-fill" style="width:${w}%; background:${fill}"></span></span><span class="bl-value">${valText}</span></div>`;
  }).join('');
  return `<div class="chart-wrap"><div class="barlist">${rows}</div></div>`;
}
/* 「〜の生産量1位は？」の答え合わせで、2位・3位もまとめて見せる（覚えやすくするため） */
function factRanksBlock(ranks, answer){
  if(!ranks || !ranks.length) return '';
  // 「2位は？」を問う設問もあるので、1位固定ではなく答えと一致する行を強調する
  let hit = 0;
  if(answer){
    const idx = ranks.findIndex(n=>n===answer || n.startsWith(answer));
    if(idx >= 0) hit = idx;
  }
  const rows = ranks.map((name,i)=>
    `<tr class="${i===hit?'rankhit':''}"><td class="rank">${i+1}位</td><td>${name}</td></tr>`
  ).join('');
  return `<div class="chart-wrap rankctx"><div class="chart-title">くわしい順位</div>
    <table><tbody>${rows}</tbody></table></div>`;
}
function rankContextTable(table, highlightRank){
  const rows = table.items.map(i=>{
    const hit = i.rank===highlightRank;
    return `<tr class="${hit?'rankhit':''}"><td class="rank">${i.rank}位</td><td>${i.name}</td><td>${i.value||'—'}</td></tr>`;
  }).join('');
  return `<div class="chart-wrap rankctx"><div class="chart-title">${table.title} 全体の順位</div>
    <table><tbody>${rows}</tbody></table></div>`;
}
function pyramidIcon(type,label,masked){
  const shapes = {
    fuji: 'M50,8 L90,92 L10,92 Z',
    bell: 'M50,10 C32,10 26,26 30,40 C18,50 14,66 18,92 L82,92 C86,66 82,50 70,40 C74,26 68,10 50,10 Z',
    tsubo:'M40,8 C40,8 46,24 34,34 C20,44 18,60 26,74 C18,80 16,86 18,92 L82,92 C84,86 82,80 74,74 C82,60 80,44 66,34 C54,24 60,8 60,8 Z'
  };
  return `<div class="chart-wrap pyramid-wrap"><svg viewBox="0 0 100 100" width="108" height="108"><path d="${shapes[type]}" fill="var(--s1)" fill-opacity="0.85" stroke="var(--accent)" stroke-width="2"/></svg><div class="pyramid-label">${masked?MASK:label}</div></div>`;
}
function compassDiagram(p, maskDir){
  const pt = (dir,label)=> maskDir===dir
    ? `<div class="compass-pt"><b>${label}</b><span>${MASK}</span></div>`
    : `<div class="compass-pt"><b>${label}</b><span>${p[dir].name}</span><small>${p[dir].detail}</small></div>`;
  return `<div class="chart-wrap"><div class="compass">
    ${pt('n','最北端')}
    <div class="compass-row">
      ${pt('w','最西端')}
      <div class="compass-center">日本</div>
      ${pt('e','最東端')}
    </div>
    ${pt('s','最南端')}
  </div></div>`;
}

];

/* ========================= ユーティリティ ========================= */
function shuffle(arr){const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;}
function sample(arr,n){return shuffle(arr).slice(0,n);}

function buildDomainPool(domain){
  const set = new Set();
  RANKINGS.filter(t=>t.domain===domain).forEach(t=>t.items.forEach(i=>{ if(i.name) set.add(i.name); }));
  return set;
}
function buildFactPool(key){
  const set = new Set();
  buildDomainPool(key).forEach(v=>set.add(v));
  FACTS.filter(f=>f.pool===key).forEach(f=>{ if(!f.choices) set.add(f.a); });
  return [...set];
}
function getChoicesForFact(f){
  if(f.choices) return shuffle(f.choices.slice());
  const pool = buildFactPool(f.pool).filter(x=>x!==f.a);
  const picks = sample(pool, Math.min(3,pool.length));
  return shuffle([f.a,...picks]);
}
function getChoicesForRank(table, item, mode){
  if(mode==='rank2name'){
    let pool = [...buildDomainPool(table.domain)].filter(n=>n!==item.name);
    if(pool.length<3){
      pool = RANKINGS.filter(t=>t.cat===table.cat).flatMap(t=>t.items.map(i=>i.name)).filter(n=>n && n!==item.name);
    }
    const uniq = [...new Set(pool)];
    const picks = sample(uniq, Math.min(3,uniq.length));
    return shuffle([item.name,...picks]);
  } else {
    let pool = table.items.filter(i=>i.rank!==item.rank).map(i=>i.rank+'位');
    // 項目数の少ない表では表内だけでは3つに足りないので、近い順位を足して必ず4択にする
    for(let d=1; [...new Set(pool)].length<3 && d<=10; d++){
      [item.rank-d, item.rank+d].forEach(r=>{
        if(r>0 && r!==item.rank) pool.push(r+'位');
      });
    }
    const uniq = [...new Set(pool)];
    const picks = sample(uniq, Math.min(3,uniq.length));
    return shuffle([item.rank+'位',...picks]);
  }
}

/* クイズ・フラッシュカード用の統一カードプールを構築。includeRef=trueで参考データも含める */
function buildDeck(cats, includeRef){
  const deck = [];
  RANKINGS.filter(t=>cats.includes(t.cat) && (includeRef || t.tier!=='ref')).forEach(t=>{
    t.items.forEach(item=>{
      deck.push({
        id: t.id+'-'+item.rank+'-r2n',
        cat: t.cat, tier: t.tier||'core', badge: t.title, chartKey: t.chartKey,
        q: (t.title.replace(/^(表|参考|図)\d*\s?/,'')) + 'で ' + item.rank + '位 は？',
        a: item.name,
        getChoices: ()=>getChoicesForRank(t,item,'rank2name'),
        rankTable: t, rankHere: item.rank
      });
      deck.push({
        id: t.id+'-'+item.rank+'-n2r',
        cat: t.cat, tier: t.tier||'core', badge: t.title, chartKey: t.chartKey,
        q: item.name + ' は「' + (t.title.replace(/^(表|参考|図)\d*\s?/,'')) + '」で 何位？',
        a: item.rank+'位',
        getChoices: ()=>getChoicesForRank(t,item,'name2rank'),
        rankTable: t, rankHere: item.rank
      });
    });
  });
  FACTS.filter(f=>cats.includes(f.cat) && (includeRef || f.tier!=='ref')).forEach(f=>{
    deck.push({
      id: f.id, cat: f.cat, tier: f.tier||'core', badge: f.group, chartKey: f.chartKey, maskKey: f.maskKey,
      q: f.q, a: f.a, detail: f.detail, ranks: f.ranks,
      getChoices: ()=>getChoicesForFact(f)
    });
  });
  return deck;
}

const STORE_KEY = 'shakai_ankiapp_stats_v1';
function currentProfile(){ return localStorage.getItem('shakai_profile'); }
function profileStoreKey(){ return STORE_KEY + '__' + currentProfile(); }
function loadStats(){ try{ return JSON.parse(localStorage.getItem(profileStoreKey()))||{}; }catch(e){ return {}; } }
function saveStats(s){ localStorage.setItem(profileStoreKey(), JSON.stringify(s)); }
function selectProfile(id){
  localStorage.setItem('shakai_profile', id);
  go('home');
}
function markResult(id, ok){
  const s = loadStats();
  if(!s[id]) s[id] = {seen:0, wrong:0};
  s[id].seen++; if(!ok) s[id].wrong++;
  saveStats(s);
}

/* ---- 小テストで間違えた問題 ---- */
const TESTMARK_KEY = 'shakai_testwrong_v1';
function myTests(){ return TESTS.filter(t=>!t.profile || t.profile===currentProfile()); }
function loadTestMarks(){
  try{ return JSON.parse(localStorage.getItem(TESTMARK_KEY+'__'+currentProfile()))||[]; }catch(e){ return []; }
}
function saveTestMarks(a){ localStorage.setItem(TESTMARK_KEY+'__'+currentProfile(), JSON.stringify(a)); }
function testWrongSet(){
  const s = new Set();
  myTests().forEach(t=>t.wrongIds.forEach(id=>s.add(id)));
  loadTestMarks().forEach(id=>s.add(id));
  return s;
}
function isTestWrong(id){ return testWrongSet().has(id); }
// アプリのクイズ／カードで間違えた問題（紙のテストとは別枠で表示する）
function isAppWrong(id){ const s = loadStats(); return !!(s[id] && s[id].wrong>0); }
// 苦手＝2つのフラグ（アプリ／紙のテスト）のいずれかが立っている問題
function isWeak(id){ return isAppWrong(id) || isTestWrong(id); }
function wrongBadges(id){
  return (isAppWrong(id) ? '<span class="tag-wrong">✏️ アプリで間違えた</span>' : '')
       + (isTestWrong(id) ? '<span class="tag-test">📕 テストで間違えた</span>' : '');
}
// 実際のテスト由来の印は記録なので消せない。手動で付けた分だけ外せる。
function isFromPaperTest(id){ return myTests().some(t=>t.wrongIds.includes(id)); }
function toggleTestWrong(id){
  if(isFromPaperTest(id)) return;
  const marks = loadTestMarks();
  const i = marks.indexOf(id);
  if(i>=0) marks.splice(i,1); else marks.push(id);
  saveTestMarks(marks);
  render();
}
function buildFullIndex(){
  const map = {};
  buildDeck(CATS, true).forEach(c=>{ map[c.id] = c; });
  return map;
}

function startQuiz(mode){
  const picked = pickDeck(mode);
  if(!picked) return;
  state.quizMode = mode;
  const deck = (mode==='all') ? shuffle(picked) : sortByWeakness(picked);
  // テスト直しは全問やりきりたいので10問で切らない
  const limit = (mode==='test') ? deck.length : Math.min(10, deck.length);
  const qs = deck.slice(0, limit).map(card=>({
    card, choices: card.getChoices(), answered:false, correct:null
  }));
  state.quiz = { qs, idx:0, correctCount:0, wrongList:[] };
  go('quiz');
}
function renderQuiz(){
  const quiz = state.quiz;
  if(!quiz) return `<div class="empty">クイズが開始されていません</div>`;
  const cur = quiz.qs[quiz.idx];
  const pct = Math.round((quiz.idx)/quiz.qs.length*100);
  const chart = cur.card.chartKey && VISUALS[cur.card.chartKey];
  const showChart = false;
  const showPlaceholder = chart && !cur.card.rankTable;
  const chartHtml = showChart ? `<div class="qchart" id="qchartWrap">${chart.render(cur.card.maskKey)}</div>`
    : showPlaceholder ? `<div class="qchart" id="qchartWrap"><div class="chart-wrap chart-hidden">📊 図は回答後に表示されます</div></div>` : '';
  return `
    <div class="progressbar"><i style="width:${pct}%"></i></div>
    <div class="qbadge">${cur.card.badge}${cur.card.tier==='ref'?'<span class="tag-ref">参考</span>':''}${wrongBadges(cur.card.id)}　（${quiz.idx+1} / ${quiz.qs.length}）</div>
    <div class="qtext">${cur.card.q}</div>
    ${chartHtml}

/* 紙のテストで間違えた問題を、その場で自分で印を付けられるようにする */
function testMarkButton(id){
  if(isFromPaperTest(id)){
    return `<div class="note">📕 この問題は小テストで間違えた問題として記録されています</div>`;
  }
  const on = isTestWrong(id);
  return `<button class="btn-testmark ${on?'on':''}" onclick="toggleTestWrong('${id}')">
    ${on ? '📕 テストで間違えた問題に登録ずみ（タップで解除）' : '📕 テストで間違えた問題に追加'}
  </button>`;
}
function answerQuiz(i){
  const quiz = state.quiz;
  const cur = quiz.qs[quiz.idx];
  if(cur.answered) return;
  cur.answered = true;
  const chosen = cur.choices[i];
  const ok = chosen === cur.card.a;
  cur.correct = ok;
  if(ok) quiz.correctCount++;
  else quiz.wrongList.push(cur.card);
  markResult(cur.card.id, ok);

  document.querySelectorAll('#choicesWrap .choice').forEach((btn,idx)=>{
    btn.disabled = true;
    if(cur.choices[idx]===cur.card.a) btn.classList.add('correct');
    else if(idx===i) btn.classList.add('wrong');
  });
  // 順位表がある項目は1位の産地情報もそこに載っているので、注釈は出さず順位表にまとめる
  if(cur.card.ranks && cur.card.ranks.length){
    document.getElementById('detailWrap').innerHTML = factRanksBlock(cur.card.ranks, cur.card.a);
  } else if(cur.card.detail){
    document.getElementById('detailWrap').innerHTML =
      `<div class="note">💡 ${cur.card.a}　${cur.card.detail}</div>`;
  }
  if(cur.card.rankTable){
    document.getElementById('rankctxWrap').innerHTML = rankContextTable(cur.card.rankTable, cur.card.rankHere);
  }
  if(cur.card.chartKey && VISUALS[cur.card.chartKey] && !cur.card.rankTable){
    const el = document.getElementById('qchartWrap');
    if(el) el.innerHTML = VISUALS[cur.card.chartKey].render();
  }
  document.getElementById('testmarkWrap').innerHTML = testMarkButton(cur.card.id);
  const isLast = quiz.idx === quiz.qs.length-1;
  document.getElementById('nextbar').innerHTML =
    `<button class="btn-primary" onclick="nextQuiz()">${isLast?'結果を見る':'次の問題 →'}</button>`;
}

      <button class="chip ${state.includeRef?'active':''}" onclick="toggleRef()">📚 参考データも含める</button>
    </div>
    <p style="color:var(--sub); font-size:13.5px; margin-bottom:20px;">対象 ${deckLen} 項目</p>
    <button class="btn-primary" style="width:100%; padding:16px; margin-bottom:10px;" onclick="startFc('all')">全カードで開始</button>
    ${weakModeButtons('fc')}
  `;
}
/* テストで間違えた問題はユーザーごとの記録。0問なら押せないようにする */
/* 苦手／テストで間違えた／アプリで間違えた の3種類を選べるようにする */
function weakModeButtons(kind){
  const q = (kind==='quiz');
  const call = m => (q ? "startQuiz('" : "startFc('") + m + "')";
  const all = Object.keys(buildFullIndex());
  const nWeak = all.filter(id=>isWeak(id)).length;
  const nTest = testWrongSet().size;
  const nApp  = all.filter(id=>isAppWrong(id)).length;
  const label = q ? 'で出題' : 'で開始';

  let html = '';
  html += '<button class="btn-ghost" style="width:100%; padding:14px; margin-bottom:10px;"'
       + (nWeak? ' onclick="'+call('wrong')+'"' : ' disabled')
       + '>苦手な問題だけ' + label + '（' + nWeak + '問）</button>';
  html += '<button class="btn-test" style="width:100%; padding:14px; margin-bottom:10px;"'
       + (nTest? ' onclick="'+call('test')+'"' : ' disabled')
       + '>📕 テストで間違えた問題だけ（' + nTest + '問）</button>';
  html += '<button class="btn-appwrong" style="width:100%; padding:14px;"'
       + (nApp? ' onclick="'+call('app')+'"' : ' disabled')
       + '>✏️ アプリで間違えた問題だけ（' + nApp + '問）</button>';
  if(nWeak===0){
    html += '<p style="color:var(--sub); font-size:12px; margin:10px 2px 0;">クイズに挑戦するか、回答画面で「テストで間違えた」印を付けると使えます。</p>';
  } else {
    html += '<p style="color:var(--sub); font-size:12px; margin:10px 2px 0;">「苦手な問題」は 📕テスト と ✏️アプリ の両方をまとめたものです。間違えた回数が多い問題ほど、よく出るようになります。</p>';
  }
  return html;
}
/* 重み付きランダム。順番はランダムだが、間違えた回数が多い問題ほど
   前の方に来やすく＝よく出るようにする（Efraimidis-Spirakis法）。 */
function sortByWeakness(deck){
  const stats = loadStats();
  return deck.map(c=>{
    const wrong = stats[c.id] ? stats[c.id].wrong : 0;
    const weight = 1 + wrong + (isTestWrong(c.id) ? 1 : 0);
    return { c: c, key: Math.pow(Math.random(), 1/weight) };
  }).sort((x,y)=> y.key - x.key).map(x=>x.c);
}
function pickDeck(mode){
  let deck = buildDeck(state.cats, state.includeRef);
  if(mode==='wrong'){
    // 印が付いているのに範囲設定で隠れてしまわないよう、参考データも対象にする
    deck = buildDeck(state.cats, true).filter(c=> isWeak(c.id));
    if(deck.length===0){ alert('苦手な問題はまだありません。クイズに挑戦するか、テストで間違えた問題を登録してください。'); return null; }
  } else if(mode==='app'){
    deck = buildDeck(state.cats, true).filter(c=> isAppWrong(c.id));
    if(deck.length===0){ alert('アプリで間違えた問題はまだありません。クイズに挑戦してみてください。'); return null; }
  } else if(mode==='test'){
    const set = testWrongSet();
    // テストで間違えた問題は範囲設定に関係なく全部出す
    deck = buildDeck(CATS, true).filter(c=> set.has(c.id));
    if(deck.length===0){ alert('「'+PROFILES[currentProfile()].full+'」にはテストで間違えた問題が登録されていません。ユーザーを切り替えるか、回答画面で印を付けてください。'); return null; }
  }
  return deck;
}
function startFc(mode){
  const deck = pickDeck(mode);
  if(!deck) return;
  const ordered = (mode==='all') ? shuffle(deck) : sortByWeakness(deck);
  state.fc = { deck: ordered, idx:0, flipped:false };
  go('fc');
}
function renderFc(){
  const fc = state.fc;
  if(!fc) return `<div class="empty">カードが選択されていません</div>`;
  const cur = fc.deck[fc.idx];
  const chart = cur.chartKey && VISUALS[cur.chartKey];
  const showChart = false;
  const showPlaceholder = chart && !cur.rankTable;
  return `
    <div class="fc-wrap">
      <div class="fc-count">${fc.idx+1} / ${fc.deck.length}</div>
      <div class="card3d" onclick="flipFc()">
        <div class="card-inner ${fc.flipped?'flip':''}" id="cardInner">
          <div class="face front">
            <div class="tag">${cur.badge}${wrongBadges(cur.id)}</div>
            <div class="main">${cur.q}</div>
            ${showChart ? chart.render(cur.maskKey) : ''}
            ${showPlaceholder ? `<div class="chart-wrap chart-hidden">📊 図は裏面で表示されます</div>` : ''}
            <div class="spacer"></div>
            <div class="hint">タップしてめくる</div>
          </div>
          <div class="face back">
            <div class="tag">こたえ</div>
            <div class="main">${cur.a}${(cur.detail && !(cur.ranks&&cur.ranks.length))?`<span class="ansdetail">（${cur.detail}）</span>`:''}</div>
            ${(showChart||showPlaceholder) ? chart.render() : ''}
            ${cur.ranks&&cur.ranks.length ? factRanksBlock(cur.ranks, cur.a) : ''}
            ${cur.rankTable ? rankContextTable(cur.rankTable, cur.rankHere) : ''}
            <div class="spacer"></div>
            <div class="hint">タップして戻す</div>
          </div>
        </div>
      </div>
      <div class="fc-btns">
        <button class="fc-good" id="fcGoodBtn" onclick="fcGoodClick()">覚えた ✓</button>
        <button class="fc-wrong" onclick="fcResult(false)">間違えた</button>
        <button class="fc-again" onclick="fcSkip()">次へ</button>
      </div>
      <div class="fc-nav">
        <span onclick="fcPrev()">← 前へ</span>
        <span onclick="fcNext()">次へ →</span>
      </div>
    </div>
  `;
}
function flipFc(){ state.fc.flipped = !state.fc.flipped; fcResetGoodConfirm(); render(); }

let fcGoodArmed = false;
let fcGoodTimer = null;
function fcResetGoodConfirm(){
  fcGoodArmed = false;
  if(fcGoodTimer){ clearTimeout(fcGoodTimer); fcGoodTimer = null; }
}
function fcGoodClick(){
  const btn = document.getElementById('fcGoodBtn');
  if(!fcGoodArmed){
    fcGoodArmed = true;
    if(btn){ btn.textContent = 'もう一度タップで確定'; btn.classList.add('confirming'); }
    fcGoodTimer = setTimeout(()=>{
      fcGoodArmed = false;
      if(btn){ btn.textContent = '覚えた ✓'; btn.classList.remove('confirming'); }
    }, 2500);
    return;
  }
  fcResetGoodConfirm();
  fcResult(true);
}
function fcResult(ok){
  const fc = state.fc;
  fcResetGoodConfirm();
  markResult(fc.deck[fc.idx].id, ok);
  fcNext();
}
// 「次へ」は単に送るだけ。ここで誤答として記録すると、めくっただけで
// 全部が苦手判定になり正答率も崩れるため、記録は残さない。
function fcSkip(){
  fcResetGoodConfirm();
  fcNext();
}
function fcNext(){
  const fc = state.fc;
  fcResetGoodConfirm();
  if(fc.idx < fc.deck.length-1) fc.idx++; else fc.idx = 0;
  fc.flipped = false;
  render();
}
function fcPrev(){
  const fc = state.fc;
  fcResetGoodConfirm();
  fc.idx = fc.idx>0 ? fc.idx-1 : fc.deck.length-1;
  fc.flipped = false;
  render();
}

/* ========================= 学習記録（フィードバック） ========================= */
/* 小テストで間違えた問題の記録（アプリ内の正誤とは別に残す） */
function renderTestSection(index){
  const set = testWrongSet();
  if(set.size===0) return '';
  const stats = loadStats();
  const rows = [...set].filter(id=>index[id]).map(id=>{
    const c = index[id];
    const s = stats[id];
    const done = s && s.seen>0;
    const ok = done && s.wrong===0;
    const state = ok ? '<span class="tm-ok">✓ アプリで正解</span>'
                : done ? '<span class="tm-ng">まだ間違えている</span>'
                : '<span class="tm-yet">未着手</span>';
    return `<div class="wronglist"><div class="q">${c.badge}　${state}</div><div class="a">${c.q}</div></div>`;
  }).join('');
  const history = myTests().map(t=>
    `<div class="note">📕 ${t.title}（${t.date}／${t.score}）　間違い ${t.wrongIds.length}問</div>`
  ).join('');
  return `
    <div class="section-title">📕 テストで間違えた問題（${set.size}問）</div>
    ${history}
    ${rows}
    <div style="margin-top:10px;">
      <button class="btn-test" style="width:100%; padding:14px;" onclick="startQuiz('test')">この問題だけで解き直す</button>
    </div>
  `;
}
function renderStats(){
  const stats = loadStats();
  const index = buildFullIndex();
  const ids = Object.keys(stats).filter(id=>stats[id].seen>0 && index[id]);
  if(ids.length===0){
    return `${renderTestSection(index)}
      <div class="empty">「${PROFILES[currentProfile()].full}」の学習記録はまだありません。<br>クイズかフラッシュカードに挑戦してみましょう。</div>`;
  }
  let totalSeen=0, totalWrong=0;
  const byCat = {}; CATS.forEach(c=>{ byCat[c] = {seen:0, wrong:0}; });
  ids.forEach(id=>{
    const s = stats[id]; const c = index[id];
    totalSeen += s.seen; totalWrong += s.wrong;
    if(byCat[c.cat]){ byCat[c.cat].seen += s.seen; byCat[c.cat].wrong += s.wrong; }
  });
  const acc = totalSeen? Math.round((totalSeen-totalWrong)/totalSeen*100) : 0;
  const wrongRate = totalSeen? Math.round(totalWrong/totalSeen*100) : 0;

  const worst = ids.map(id=>({id, card:index[id], seen:stats[id].seen, wrong:stats[id].wrong}))
    .filter(x=>x.wrong>0)
    .sort((a,b)=> (b.wrong/b.seen) - (a.wrong/a.seen) || b.wrong-a.wrong)
    .slice(0,15);

  const catRows = Object.keys(byCat).map(c=>{
    const b = byCat[c];
    if(b.seen===0) return '';
    const a = Math.round((b.seen-b.wrong)/b.seen*100);
    return `<div class="barlist-row"><span class="bl-label">${c}（${b.seen}問）</span><span class="bl-track"><span class="bl-fill" style="width:${a}%; background:var(--good)"></span></span><span class="bl-value">${a}%</span></div>`;
  }).join('');

  return `
    <div class="section-title">「${PROFILES[currentProfile()].full}」の学習記録</div>
    <div class="score-row">
      <div class="score-box"><b>${totalSeen}</b>解答数</div>
      <div class="score-box"><b style="color:var(--good)">${acc}%</b>正答率</div>
      <div class="score-box"><b style="color:var(--bad)">${totalWrong}</b>誤答数（${wrongRate}%）</div>
    </div>
    <div class="section-title">カテゴリ別 正答率</div>
    <div class="chart-wrap"><div class="barlist">${catRows}</div></div>
    <div class="section-title">✏️ アプリで間違えた問題（誤答が多い順・上位15）</div>
    ${worst.length ? worst.map(w=>{
        const a = Math.round((w.seen-w.wrong)/w.seen*100);
        return `<div class="wronglist"><div class="q">${w.card.badge}　出題${w.seen}回／誤答${w.wrong}回（正答率${a}%）</div><div class="a" style="color:var(--bad)">${w.card.q}</div></div>`;
      }).join('')
      : `<div class="empty">まだ誤答はありません 🎉</div>`}
    ${renderTestSection(index)}
    <div style="margin-top:22px;">
      <button class="btn-ghost" style="width:100%; padding:14px;" onclick="resetStatsConfirm()">学習記録をリセット</button>
    </div>
  `;
}
function resetStatsConfirm(){
  if(confirm('「'+PROFILES[currentProfile()].full+'」の学習記録（正答率・誤答数など）をすべて削除します。よろしいですか？')){
    localStorage.removeItem(profileStoreKey());
    go('stats');
  }
}

/* ========================= 初期化 ========================= */
window.go = go; window.toggleCat = toggleCat; window.toggleRef = toggleRef;
window.startQuiz = startQuiz; window.answerQuiz = answerQuiz; window.nextQuiz = nextQuiz;
window.startFc = startFc; window.flipFc = flipFc; window.fcResult = fcResult; window.fcNext = fcNext; window.fcPrev = fcPrev;
window.toggleTestWrong = toggleTestWrong; window.fcSkip = fcSkip;
window.fcGoodClick = fcGoodClick;
window.resetStatsConfirm = resetStatsConfirm;
window.selectProfile = selectProfile;

render();

if('serviceWorker' in navigator){
  let swRefreshed = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(swRefreshed) return;
    swRefreshed = true;
    window.location.reload();
  });
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./service-worker.js').then(reg=>{
      reg.update().catch(()=>{});
    }).catch(()=>{});
  });
}
</script>
